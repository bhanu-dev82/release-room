# Which provider runs each agent. Keep this in sync with
# switch/release-room.template.yaml.
#
# All three agents run on the Antigravity CLI (agy). Switch can't select
# Antigravity's model per agent (its provider plugin has no model list), so
# the model is whatever agy is set to.
#
# Earlier plan (OpenCode with nebius/xai models) was dropped: OpenCode 2.x isn't
# supported by Switch 0.40, and 1.x needed a separate install.
provider: antigravity

roles:
  triage:   antigravity   # reads reviews, writes cards
  fixer:    antigravity   # writes tests and patches; pushes and PRs need a person's Allow
  reviewer: antigravity   # independent check on the patch; read-only by instruction
